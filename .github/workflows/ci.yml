name: Build and Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The libraries target net8.0 and netstandard2.0. Running the suite on
        # the .NET 10 runtime as well proves the shipped net8.0 assets keep
        # working there, which is what a consumer on the current LTS actually does.
        dotnet: ["8.0.x", "10.0.x"]

    name: build (${{ matrix.dotnet }})

    env:
      # Only the matrix SDK is installed, so on the 10.0.x leg the net8.0 test
      # assemblies have no 8.0 runtime to load and roll forward to 10 instead.
      # Installing both runtimes would make that leg silently re-run on 8.0,
      # which is a gate that cannot fail.
      DOTNET_ROLL_FORWARD: LatestMajor

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      # The evidence that the 10.0.x leg is not quietly re-running on 8.0. If an
      # 8.0 runtime appears in this list, roll-forward never happened and this
      # leg is testing the same thing as the other one.
      - name: Show the runtimes the tests can load
        run: |
          dotnet --list-runtimes
          if [ "${{ matrix.dotnet }}" != "8.0.x" ] && dotnet --list-runtimes | grep -q "Microsoft.NETCore.App 8\."; then
            echo "::error::A .NET 8 runtime is installed on the ${{ matrix.dotnet }} leg, so the net8.0 assets will load there instead of rolling forward."
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --configuration Release --no-build --verbosity normal
          --collect:"XPlat Code Coverage" --results-directory ./TestResults

      # The suite is split over nine projects and each writes its own report
      # listing every package, so this merges them before checking. Without the
      # merge the number is meaningless and no threshold could be trusted.
      - name: Coverage floor
        if: matrix.dotnet == '8.0.x'
        run: python3 build/coverage-gate.py ./TestResults 75

      # The AOT claim, re-proved on every push. Library annotations do not prove
      # that the ILC compiler accepts the packages, and they do not prove the
      # binary behaves. Publishing it and running it does both.
      - name: Native AOT publish and run
        if: matrix.dotnet == '8.0.x'
        run: |
          dotnet publish tests/Verdict.Aot.Smoke -c Release -r linux-x64 --nologo
          BINARY=tests/Verdict.Aot.Smoke/bin/Release/net8.0/linux-x64/native/Verdict.Aot.Smoke
          ls -l "$BINARY"
          SIZE=$(stat -c%s "$BINARY")
          echo "Native binary: $SIZE bytes"
          # A tripwire rather than a precise claim. The point is to notice if
          # something drags a large dependency into the graph.
          if [ "$SIZE" -gt 8000000 ]; then
            echo "::error::Native binary is $SIZE bytes, over the 8 MB ceiling."
            exit 1
          fi
          "$BINARY"

      - name: Upload coverage reports to Codecov
        if: matrix.dotnet == '8.0.x'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./TestResults
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
