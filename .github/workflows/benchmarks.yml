name: Benchmarks

# Deliberately not a pull request gate. BenchmarkDotNet on a shared runner has enough
# run-to-run variance to fail an innocent change, and a check that cries wolf is one people
# learn to ignore. Allocation counts are gated on every PR instead, because they are
# deterministic; timing is tracked here on a schedule and on demand.

on:
  workflow_dispatch:
  schedule:
    # Mondays, 02:00 UTC.
    - cron: "0 2 * * 1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run benchmarks
        run: dotnet run -c Release --project benchmarks/Verdict.Benchmarks -- --filter "*" --exporters json markdown

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/
          if-no-files-found: warn
