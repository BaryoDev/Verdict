name: Publish to NuGet

# Version comes from <VersionPrefix> in Directory.Build.props, never from a
# hand-typed input, so the published version is always recorded in git.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack without publishing"
        type: boolean
        default: true

jobs:
  dry-run:
    # Own group, so a dry run never replaces a pending publish.
    concurrency:
      group: publish-dry-run-${{ github.ref }}
      cancel-in-progress: false
    # Dispatch with dry_run on. Builds, tests and packs only: no key exchange and no push,
    # and no environment, so it runs from any branch.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Both, because the libraries target net8.0 and net10.0. The 8.0 SDK
          # alone cannot build the net10.0 assets and pack would fail here,
          # after the tag exists.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read version from source
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version from Directory.Build.props: $VERSION"

      # Runs unconditionally. A publish that is not from a tag fails here rather
      # than silently skipping the push step and looking like a success.
      - name: Confirm this publish is from a matching tag
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag $TAG does not match VersionPrefix $VERSION"
              exit 1
            fi
            echo "Tag $TAG matches VersionPrefix $VERSION."
            exit 0
          fi

          # Not a tag. Packing only.
          echo "Not a tag, and dry_run is on. Packing only."

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      # A package must never ship without its tests having run.
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack Verdict.sln --configuration Release --no-build --output ./nupkgs

      - name: List artifacts
        run: ls -la ./nupkgs

      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ./nupkgs/*

  publish:
    # Tag push, or dispatch with dry_run off. Runs in the protected environment.
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: nuget-release
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      # Lets the runner mint the OIDC token nuget.org exchanges for a
      # short-lived API key. No long-lived secret is involved.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag can be pushed on any commit, and the environment only checks the tag name.
      # The commit has to be on the default branch before anything else runs.
      - name: Require the commit to be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$GITHUB_SHA is not on $DEFAULT_BRANCH. Publish from a commit that was merged."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          # Both, because the libraries target net8.0 and net10.0. The 8.0 SDK
          # alone cannot build the net10.0 assets and pack would fail here,
          # after the tag exists.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read version from source
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version from Directory.Build.props: $VERSION"

      # Runs unconditionally. A publish that is not from a tag fails here rather
      # than silently skipping the push step and looking like a success.
      - name: Confirm this publish is from a matching tag
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag $TAG does not match VersionPrefix $VERSION"
              exit 1
            fi
            echo "Tag $TAG matches VersionPrefix $VERSION."
            exit 0
          fi

          # Not a tag. Packing and dry running is fine; publishing is not.
          if [ "$DRY_RUN" = "false" ]; then
            echo "::error::Refusing to publish from $GITHUB_REF. Push a v$VERSION tag instead."
            exit 1
          fi
          echo "Not a tag, and dry_run is on. Packing only."

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      # A package must never ship without its tests having run.
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack Verdict.sln --configuration Release --no-build --output ./nupkgs

      - name: List artifacts
        run: ls -la ./nupkgs

      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ./nupkgs/*

      # Requested here rather than earlier because the key expires after an
      # hour and each OIDC token buys exactly one key.
      # Dry runs have their own job and never reach this step. The trusted
      # publishing policy is bound to the environment this job runs in.
      - name: Exchange OIDC token for a short-lived NuGet key
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'arnelirobles' }}

      - name: Confirm the key was issued
        run: |
          if [ -z "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" ]; then
            echo "::error::No API key returned. Check the trusted publishing policy on nuget.org." && exit 1
          fi
          echo "Trusted publishing OK: short-lived key issued."

      # Belt and braces: the guard step above already fails an untagged publish,
      # and this makes the push itself unreachable from a branch.
      - name: Publish
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
