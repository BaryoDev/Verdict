# Let a contributor claim an issue themselves by commenting `/take`.
#
# GitHub's UI only offers collaborators in the assignee dropdown, and the "can this user be
# assigned" API returns 404 for everyone else, so assigning an outside contributor looks impossible
# from the web interface. The REST API allows it once the person has commented on the issue, which
# this workflow uses. That removes a round trip: nobody has to wait for a maintainer to be awake.
name: Self-assign

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

# One claim at a time per issue. The job reads the assignee list and then adds to it, so two
# comments arriving together could both see it empty and both assign, leaving two people who each
# think the issue is theirs, which is the exact outcome this workflow exists to prevent.
concurrency:
  group: self-assign-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  take:
    # Issues only. This is a cheap pre-filter; the script below checks the command exactly, because
    # `startsWith` alone would also fire on `/takeover` and quietly assign someone who was arguing
    # against the idea.
    if: >
      !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/take') || startsWith(github.event.comment.body, '.take'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const who = context.payload.comment.user.login;

            // The first token must be exactly the command. Without this, `/takeover this is a bad
            // idea` reads as a claim and assigns the person objecting to it.
            const firstToken = (context.payload.comment.body || '').trim().split(/\s+/)[0];
            if (firstToken !== '/take' && firstToken !== '.take') {
              core.info(`Not a claim command (${firstToken}); ignoring.`);
              return;
            }

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            const current = issue.assignees.map(a => a.login);

            if (current.includes(who)) {
              core.info(`${who} already has it; nothing to do.`);
              return;
            }

            // Someone else is already on it. Say so rather than silently piling on, two people
            // discovering they duplicated a weekend's work is the outcome this is meant to prevent.
            if (current.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `@${who} this one is already with @${current.join(', @')}. ` +
                      `Worth checking in with them before starting, they may be glad of the help, ` +
                      `or it may be further along than it looks. There are other issues going spare ` +
                      `under [help wanted](https://github.com/${owner}/${repo}/issues?q=is%3Aopen+label%3A%22help+wanted%22).`,
              });
              return;
            }

            await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [who] });
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `Assigned to @${who}, it's yours. 🎉\n\n` +
                    `No deadline, and no hard feelings if you change your mind; just say so and ` +
                    `someone else can pick it up. A draft PR early is very welcome if you'd like ` +
                    `eyes on the direction before polishing it.\n\n` +
                    `One thing to do now rather than later: sign the CLA at ` +
                    `https://cla-assistant.io/${owner}/${repo}. It takes about thirty seconds, you ` +
                    `keep copyright of your work, and it is one signature across all of these ` +
                    `repositories rather than one per project.\n\n` +
                    `Signing before you start matters because the agreement says what you are ` +
                    `agreeing to: contributions here are voluntary and unpaid. These projects have ` +
                    `no budget and do not commission work on issues. Better to know that now than ` +
                    `after you have written the code.\n\n` +
                    `Nothing is blocked while you wait. The signature only gates the merge.`,
            });
